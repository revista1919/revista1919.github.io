<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visor Académico - La Revista Nacional de las Ciencias para Estudiantes</title>

  <!-- PDF.js desde CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js">
  </script>

  <!-- Fuentes académicas premium -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;1,400&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

  <style>
    :root {
      --oxford-blue: #002147;
      --oxford-dark: #00152e;
      --elsevier-orange: #FF6C0C;
      --elsevier-hover: #e65a00;
      --bg-reader: #e3e8ee;
      --bg-sidebar: #ffffff;
      --text-main: #1f2937;
      --text-muted: #6b7280;
      --toolbar-height: 56px;
      --sidebar-width: 320px;
      --shadow-sm: 0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1), 0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1), 0 4px 6px -4px rgb(0 0 0 / 0.1);
      --shadow-paper: 0 1px 3px rgba(0,0,0,0.05), 0 10px 30px rgba(0, 33, 71, 0.12);
      --transition-spring: cubic-bezier(0.25, 0.8, 0.25, 1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-reader);
      overflow: hidden;
      height: 100vh;
      width: 100vw;
      display: flex;
      flex-direction: column;
      color: var(--text-main);
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* Barra superior académica */
    .pdf-toolbar {
      background: var(--oxford-blue);
      border-bottom: 2px solid var(--elsevier-orange);
      color: white;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 1000;
      height: var(--toolbar-height);
      box-shadow: 0 4px 20px rgba(0, 33, 71, 0.2);
      flex-shrink: 0;
      user-select: none;
    }

    .toolbar-group {
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn {
      background: transparent;
      border: 1px solid transparent;
      color: rgba(255, 255, 255, 0.85);
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      font-family: 'Inter', sans-serif;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: all 0.2s var(--transition-spring);
    }

    .btn:hover:not(:disabled) {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
    }
    .btn:active:not(:disabled) {
      transform: scale(0.97);
    }
    .btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .btn.active {
      background: rgba(255, 108, 12, 0.2);
      color: var(--elsevier-orange);
      border-color: rgba(255, 108, 12, 0.4);
    }
    .btn-icon {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }
    .btn-primary {
      background: var(--elsevier-orange);
      color: white !important;
      font-weight: 600;
      box-shadow: var(--shadow-sm);
    }
    .btn-primary:hover:not(:disabled) {
      background: var(--elsevier-hover);
      box-shadow: 0 4px 12px rgba(255, 108, 12, 0.3);
    }
    .divider {
      width: 1px;
      height: 20px;
      background: rgba(255, 255, 255, 0.15);
      margin: 0 10px;
    }

    /* Buscador premium con barra flotante */
    .search-bar {
      opacity: 0;
      visibility: hidden;
      transform: translateX(-50%) translateY(-10px);
      position: absolute;
      top: calc(var(--toolbar-height) + 10px);
      left: 50%;
      background: rgba(255, 255, 255, 0.98);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 33, 71, 0.1);
      border-radius: 16px;
      box-shadow: var(--shadow-lg);
      padding: 20px;
      z-index: 1100;
      width: 440px;
      max-width: 90vw;
      transition: all 0.3s var(--transition-spring);
    }

    .search-bar.active {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    .search-input-group {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .search-input {
      flex: 1;
      padding: 12px 16px;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      font-size: 14px;
      font-family: 'Inter', sans-serif;
      transition: all 0.2s;
      background: #f9fafb;
    }

    .search-input:focus {
      outline: none;
      border-color: var(--elsevier-orange);
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(255, 108, 12, 0.1);
    }

    .search-results {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .search-result-item {
      padding: 12px;
      cursor: pointer;
      border-radius: 10px;
      transition: background 0.15s;
      border: 1px solid transparent;
      margin-bottom: 6px;
      background: #fafafa;
    }
    .search-result-item:hover {
      background: #f0f4ff;
      border-color: #d1d9e6;
    }
    .search-result-item .highlight {
      background: #fef08a;
      color: #92400e;
      font-weight: 600;
      padding: 0 2px;
      border-radius: 2px;
    }

    .viewer-wrapper {
      flex: 1;
      display: flex;
      overflow: hidden;
      position: relative;
    }

    /* Panel lateral académico */
    .pdf-sidebar {
      width: var(--sidebar-width);
      background: var(--bg-sidebar);
      border-right: 1px solid rgba(0, 33, 71, 0.1);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
      transition: margin-left 0.4s var(--transition-spring);
      flex-shrink: 0;
      box-shadow: 1px 0 12px rgba(0,0,0,0.03);
      z-index: 50;
    }

    .pdf-sidebar.hidden {
      margin-left: calc(-1 * var(--sidebar-width));
    }

    .sidebar-tabs {
      display: flex;
      border-bottom: 1px solid #e5e7eb;
      background: #f9fafb;
      padding: 0 10px;
    }

    .sidebar-tab {
      flex: 1;
      padding: 16px 8px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      position: relative;
      transition: color 0.2s;
    }

    .sidebar-tab:hover {
      color: var(--oxford-blue);
    }
    .sidebar-tab.active {
      color: var(--oxford-blue);
    }
    .sidebar-tab::after {
      content: '';
      position: absolute;
      bottom: -1px;
      left: 0;
      width: 100%;
      height: 2px;
      background: var(--elsevier-orange);
      transform: scaleX(0);
      transition: transform 0.3s var(--transition-spring);
    }
    .sidebar-tab.active::after {
      transform: scaleX(1);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      background: white;
      padding: 0;
    }
    .sidebar-panel {
      display: none;
      padding: 24px;
      animation: fadeIn 0.3s ease;
    }
    .sidebar-panel.active {
      display: block;
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .sidebar-section {
      margin-bottom: 24px;
    }
    .sidebar-section h3 {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--text-muted);
      margin-bottom: 12px;
      letter-spacing: 0.08em;
      font-weight: 700;
    }
    .sidebar-section p {
      font-size: 13px;
      margin-bottom: 8px;
      line-height: 1.6;
    }

    .doi-badge {
      display: inline-flex;
      align-items: center;
      background: #fff7ed;
      color: var(--elsevier-hover);
      padding: 6px 12px;
      border-radius: 6px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      text-decoration: none;
      border: 1px solid #fed7aa;
      transition: all 0.2s;
      word-break: break-all;
    }
    .doi-badge:hover {
      background: #ffedd5;
      box-shadow: var(--shadow-sm);
    }

    .toc-item {
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
      color: var(--text-main);
      border-radius: 6px;
      transition: all 0.2s;
      display: flex;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 2px;
    }
    .toc-item:hover {
      background: #f3f4f6;
      color: var(--oxford-blue);
    }
    .toc-level-1 {
      font-weight: 600;
    }
    .toc-level-2 {
      padding-left: 24px;
      font-size: 12.5px;
      color: var(--text-muted);
    }
    .toc-page {
      color: var(--text-muted);
      font-size: 11px;
      margin-left: auto;
      font-family: 'JetBrains Mono', monospace;
    }

    /* Contenedor principal de páginas con scroll limpio */
    .pdf-container {
      flex: 1;
      overflow: auto;
      padding: 40px 20px 80px;
      background: var(--bg-reader);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      scroll-behavior: smooth;
      position: relative;
    }

    .pdf-page-wrapper {
      position: relative;
      background: white;
      box-shadow: var(--shadow-paper);
      border-radius: 2px;
      min-height: 800px;
      width: 100%;
      max-width: fit-content;
      transition: transform 0.2s ease;
    }

    .pdf-canvas {
      display: block;
      background: white;
      border-radius: 2px;
      pointer-events: none; /* El canvas no captura eventos, todo se maneja en capas superiores */
    }

    /* Capa de texto y selección con textLayer de pdf.js */
    .text-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0.25; /* Texto invisible pero seleccionable */
      pointer-events: auto;
      z-index: 5;
      line-height: 1.0;
      white-space: pre;
      transform-origin: 0 0;
      mix-blend-mode: multiply;
      user-select: text;
      -webkit-user-select: text;
      cursor: text;
    }
    .text-layer ::selection {
      background: rgba(255, 108, 12, 0.4);
    }
    .text-layer span {
      color: transparent;
      position: absolute;
      white-space: pre;
      cursor: text;
      transform-origin: 0% 0%;
    }

    /* Capa de anotaciones */
    .annotation-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 10;
    }
    .annotation-layer.active {
      pointer-events: auto;
    }

    .annotation-highlight {
      position: absolute;
      background: rgba(254, 240, 138, 0.5);
      mix-blend-mode: multiply;
      border-bottom: 2px solid #eab308;
      pointer-events: auto;
      cursor: pointer;
      transition: background 0.2s;
      border-radius: 2px;
    }
    .annotation-highlight:hover {
      background: rgba(254, 240, 138, 0.8);
    }

    .annotation-note {
      position: absolute;
      background: #ffffff;
      border-left: 4px solid var(--elsevier-orange);
      border-radius: 0 8px 8px 0;
      padding: 12px;
      font-size: 13px;
      font-family: 'Inter', sans-serif;
      pointer-events: auto;
      min-width: 180px;
      max-width: 250px;
      box-shadow: var(--shadow-md);
      z-index: 20;
      transition: transform 0.2s, box-shadow 0.2s;
      cursor: grab;
    }
    .annotation-note:focus-within {
      transform: translateY(-2px) scale(1.02);
      box-shadow: var(--shadow-lg);
      z-index: 21;
      cursor: text;
    }
    .annotation-note textarea {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 13px;
      font-family: 'Lora', serif;
      resize: none;
      min-height: 80px;
      color: var(--text-main);
      line-height: 1.5;
    }
    .annotation-note textarea:focus {
      outline: none;
    }
    .annotation-delete {
      position: absolute;
      top: -10px;
      right: -10px;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ef4444;
      color: white;
      border: 2px solid white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transform: scale(0.8);
      transition: all 0.2s var(--transition-spring);
    }
    .annotation-note:hover .annotation-delete {
      opacity: 1;
      transform: scale(1);
    }

    /* Overlay de carga */
    .loading-overlay {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: var(--bg-reader);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
      pointer-events: none;
    }

    .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 33, 71, 0.1);
      border-top: 3px solid var(--elsevier-orange);
      border-radius: 50%;
      animation: spin 1s cubic-bezier(0.55, 0.15, 0.45, 0.85) infinite;
      margin-bottom: 24px;
    }

    .loading-text {
      font-family: 'Lora', serif;
      color: var(--oxford-blue);
      font-size: 16px;
      font-style: italic;
      letter-spacing: 0.02em;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Scrollbar premium */
    ::-webkit-scrollbar {
      width: 14px;
      height: 14px;
    }
    ::-webkit-scrollbar-track {
      background: var(--bg-reader);
    }
    ::-webkit-scrollbar-thumb {
      background: #cbd5e1;
      border-radius: 7px;
      border: 4px solid var(--bg-reader);
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #94a3b8;
    }

    @media (max-width: 768px) {
      .text-hide-mobile { display: none; }
      .pdf-sidebar { position: absolute; height: 100%; z-index: 100; }
      .search-bar { width: 90%; left: 5%; transform: translateY(-10px); }
      .search-bar.active { transform: translateY(0); }
    }
  </style>
</head>
<body>

<header class="pdf-toolbar">
  <div class="toolbar-group">
    <button class="btn" onclick="goBack()" title="Volver al sistema">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
      <span class="text-hide-mobile">Volver</span>
    </button>
    <button class="btn" onclick="toggleSidebar()" title="Panel lateral">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h7"></path></svg>
    </button>
    <button class="btn" onclick="toggleSearch()" title="Buscar (Ctrl+F)">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
      <span class="text-hide-mobile">Buscar</span>
    </button>
  </div>

  <div class="toolbar-group">
    <button class="btn" id="selectTool" onclick="setTool('select')" title="Seleccionar texto">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"></path></svg>
    </button>
    <button class="btn" id="highlightTool" onclick="setTool('highlight')" title="Subrayar texto (hacer clic y arrastrar)">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
    </button>
    <button class="btn" id="noteTool" onclick="setTool('note')" title="Añadir nota (clic en la página)">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>
    </button>
  </div>

  <div class="toolbar-group">
    <button class="btn" onclick="zoomOut()" title="Alejar">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 12H4"></path></svg>
    </button>
    <span style="font-size: 13px; font-weight: 600; width: 45px; text-align: center;" id="zoomLevel">125%</span>
    <button class="btn" onclick="zoomIn()" title="Acercar">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
    </button>
    <div class="divider"></div>
    <button class="btn" onclick="printPDF()" title="Imprimir">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z"></path></svg>
    </button>
    <button class="btn btn-primary" onclick="downloadAnnotatedPDF()" title="Descargar PDF + anotaciones">
      <svg class="btn-icon" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
      <span class="text-hide-mobile">Descargar</span>
    </button>
  </div>
</header>

<!-- Barra de búsqueda flotante -->
<div class="search-bar" id="searchBar">
  <div class="search-input-group">
    <input type="text" class="search-input" id="searchInput" placeholder="Buscar en el documento..." onkeyup="handleSearch(event)">
    <button class="btn btn-primary" onclick="performSearch()">
      <svg class="btn-icon" style="width: 16px; height: 16px;" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
    </button>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<div class="viewer-wrapper">
  <aside class="pdf-sidebar" id="pdfSidebar">
    <div class="sidebar-tabs">
      <button class="sidebar-tab active" onclick="switchSidebarTab('info', this)">Detalles</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('toc', this)">Índice</button>
      <button class="sidebar-tab" onclick="switchSidebarTab('annotations', this)">Notas</button>
    </div>

    <div class="sidebar-content">
      <div class="sidebar-panel active" id="panel-info">
        <div class="sidebar-section">
          <h3>Manuscrito</h3>
          <p id="docTitle" style="font-weight: 600; color: var(--oxford-blue); font-size: 15px;">Cargando documento...</p>
        </div>
        <div class="sidebar-section">
          <h3>Identificador Permanente (DOI)</h3>
          <a href="#" class="doi-badge" id="docDoi" target="_blank">Enlace no disponible</a>
        </div>
        <div class="sidebar-section">
          <h3>Metadatos</h3>
          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f9fafb; padding: 12px; border-radius: 8px; border: 1px solid #e5e7eb;">
            <div><span style="color:var(--text-muted); font-size: 11px; text-transform:uppercase; display:block;">Páginas</span><strong style="font-size:14px;" id="docPages">-</strong></div>
            <div><span style="color:var(--text-muted); font-size: 11px; text-transform:uppercase; display:block;">Anotaciones</span><strong style="font-size:14px;" id="annotationCount">0</strong></div>
          </div>
        </div>
      </div>

      <div class="sidebar-panel" id="panel-toc">
        <div class="sidebar-section">
          <div id="tocContent">
            <p style="color: var(--text-muted); font-style: italic; font-size: 13px;">Procesando estructura...</p>
          </div>
        </div>
      </div>

      <div class="sidebar-panel" id="panel-annotations">
        <div class="sidebar-section">
          <div id="annotationsList">
            <p style="color: var(--text-muted); font-style: italic; font-size: 13px;">No hay notas registradas.</p>
          </div>
        </div>
      </div>
    </div>
  </aside>

  <main class="pdf-container" id="pdfContainer">
    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
      <div class="loading-text" id="loadingText">Renderizando manuscrito...</div>
    </div>
  </main>
</div>

<script>
  (function() {
    // Parámetros
    const urlParams = new URLSearchParams(window.location.search);
    let pdfUrl = urlParams.get('url') || urlParams.get('pdf');
    const doi = urlParams.get('doi') || '';
    const title = urlParams.get('title') || 'Manuscrito sin título';

    // Estado global
    let pdfDoc = null;
    let scale = 1.25;
    let currentTool = 'select';
    let annotations = JSON.parse(localStorage.getItem('pdfAnnotations') || '{}');
    let renderedPages = new Set();
    let pageTextContentCache = {}; // caché de contenido de texto por página

    // Normalizar URL
    function normalizeUrl(url) {
      if (!url) return url;
      const currentHost = window.location.hostname;
      const domains = ['revista1919.github.io', 'www.revistacienciasestudiantes.com', 'revistacienciasestudiantes.com'];
      for (const domain of domains) {
        if (url.includes(domain)) {
          url = url.replace(domain, currentHost);
          break;
        }
      }
      return url;
    }
    pdfUrl = normalizeUrl(pdfUrl);

    // Configurar PDF.js worker
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

    // Referencias DOM
    const pdfContainer = document.getElementById('pdfContainer');
    const loadingOverlay = document.getElementById('loading');
    const docTitleEl = document.getElementById('docTitle');
    const docDoiEl = document.getElementById('docDoi');
    const docPagesEl = document.getElementById('docPages');
    const annotationCountEl = document.getElementById('annotationCount');
    const tocContentEl = document.getElementById('tocContent');
    const annotationsListEl = document.getElementById('annotationsList');
    const zoomLevelEl = document.getElementById('zoomLevel');
    const searchBarEl = document.getElementById('searchBar');
    const searchInputEl = document.getElementById('searchInput');
    const searchResultsEl = document.getElementById('searchResults');

    // Establecer título y DOI
    docTitleEl.textContent = title;
    if (doi) {
      docDoiEl.href = 'https://doi.org/' + doi;
      docDoiEl.textContent = 'doi.org/' + doi;
    }

    // Intersection Observer para lazy rendering
    const pageObserver = new IntersectionObserver((entries) => {
      entries.forEach(entry => {
        if (entry.isIntersecting) {
          const pageNum = parseInt(entry.target.dataset.page);
          if (!renderedPages.has(pageNum)) {
            renderPage(pageNum, entry.target);
          }
        }
      });
    }, { root: pdfContainer, rootMargin: '120% 0px', threshold: 0 });

    // Cargar PDF
    if (!pdfUrl) {
      loadingOverlay.innerHTML = '<div style="background:#fee2e2; color:#dc2626; padding: 20px; border-radius:8px;">Error: URL requerida.</div>';
    } else {
      loadPdf();
    }

    function loadPdf() {
      pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
        pdfDoc = pdf;
        docPagesEl.textContent = pdf.numPages;
        createPageContainers();
        loadOutline();
        setTimeout(() => {
          loadingOverlay.style.opacity = '0';
          loadingOverlay.style.visibility = 'hidden';
        }, 500);
      }).catch(function(error) {
        loadingOverlay.innerHTML = '<div style="background:#fee2e2; color:#dc2626; padding: 20px; border-radius:8px;">Error al cargar PDF: ' + error.message + '</div>';
      });
    }

    function createPageContainers() {
      pdfContainer.innerHTML = '';
      renderedPages.clear();
      pageTextContentCache = {};

      for (let i = 1; i <= pdfDoc.numPages; i++) {
        const pageWrapper = document.createElement('div');
        pageWrapper.className = 'pdf-page-wrapper';
        pageWrapper.id = 'page-' + i;
        pageWrapper.dataset.page = i;
        // Tamaño provisional antes de renderizar
        pageWrapper.style.width = (800 * scale) + "px";
        pageWrapper.style.height = (1035 * scale) + "px";
        pdfContainer.appendChild(pageWrapper);
        pageObserver.observe(pageWrapper);
      }
      setTool(currentTool);
      updateAnnotationCount();
      updateAnnotationsList();
    }

    // Renderizar página completa con canvas + textLayer + anotaciones
    async function renderPage(pageNum, wrapperElement) {
      renderedPages.add(pageNum);

      try {
        const page = await pdfDoc.getPage(pageNum);
        const viewport = page.getViewport({ scale: scale });
        const outputScale = window.devicePixelRatio || 1;

        wrapperElement.style.width = Math.floor(viewport.width) + "px";
        wrapperElement.style.height = Math.floor(viewport.height) + "px";

        // Limpiar contenido previo
        wrapperElement.innerHTML = '';

        // 1. Canvas
        const canvas = document.createElement('canvas');
        canvas.className = 'pdf-canvas';
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = Math.floor(viewport.width) + "px";
        canvas.style.height = Math.floor(viewport.height) + "px";
        wrapperElement.appendChild(canvas);

        const ctx = canvas.getContext('2d');
        const transform = outputScale !== 1 ? [outputScale, 0, 0, outputScale, 0, 0] : null;

        await page.render({ canvasContext: ctx, transform: transform, viewport: viewport }).promise;

        // 2. Text layer (para selección y copiado)
        const textLayerDiv = document.createElement('div');
        textLayerDiv.className = 'text-layer';
        textLayerDiv.style.setProperty('--scale-factor', viewport.scale);
        textLayerDiv.style.width = Math.floor(viewport.width) + "px";
        textLayerDiv.style.height = Math.floor(viewport.height) + "px";
        wrapperElement.appendChild(textLayerDiv);

        const textContent = await page.getTextContent();
        // Guardar en caché para búsqueda
        pageTextContentCache[pageNum] = textContent.items.map(item => item.str).join(' ');

        // Renderizar textLayer manualmente (compatible)
        pdfjsLib.renderTextLayer({
          textContentSource: textContent,
          container: textLayerDiv,
          viewport: viewport,
          textDivs: []
        }).catch(() => {
          // Fallback básico
          textLayerDiv.innerHTML = '';
        });

        // 3. Annotation layer
        const annotationLayer = document.createElement('div');
        annotationLayer.className = 'annotation-layer';
        annotationLayer.id = 'annotations-' + pageNum;
        if (currentTool !== 'select') annotationLayer.classList.add('active');
        wrapperElement.appendChild(annotationLayer);

        // Cargar anotaciones existentes para esta página
        loadAnnotationsForPage(pageNum);
      } catch (err) {
        console.warn('Render error page ' + pageNum, err);
      }
    }

    // Cargar outline/índice
    function loadOutline() {
      pdfDoc.getOutline().then(function(outline) {
        if (!outline || outline.length === 0) {
          tocContentEl.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Estructura no disponible.</p>';
          return;
        }
        let html = '';
        outline.forEach(item => html += renderOutlineItem(item, 1));
        tocContentEl.innerHTML = html;
      }).catch(() => {
        tocContentEl.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">Índice no disponible.</p>';
      });
    }

    function renderOutlineItem(item, level) {
      // Intentar obtener página del destino si existe
      let pageRef = 1;
      if (item.dest) {
        if (typeof item.dest === 'string') {
          // resolución de destinos string es compleja, usamos 1 por defecto
        } else if (Array.isArray(item.dest) && item.dest[0] && typeof item.dest[0] === 'object') {
          // obtenemos num del ref
          if (item.dest[0].num !== undefined) pageRef = item.dest[0].num + 1; // pdf.js index desde 0
        }
      } else if (item.url) {
        // Enlaces externos no se soportan en página
        pageRef = 1;
      }
      let html = `<div class="toc-item toc-level-${level}" onclick="scrollToPage(${pageRef})" style="cursor:pointer;"><span>${item.title}</span><span class="toc-page">p. ${pageRef}</span></div>`;
      if (item.items && item.items.length > 0) {
        item.items.forEach(child => html += renderOutlineItem(child, level + 1));
      }
      return html;
    }

    // Funciones globales de interfaz
    window.scrollToPage = function(pageNum) {
      const page = document.getElementById('page-' + pageNum);
      if (page) {
        page.scrollIntoView({ behavior: 'smooth', block: 'start' });
      } else {
        // Si la página no está renderizada, hacer scroll al contenedor para forzar observador
        const target = pdfContainer.querySelector(`[data-page="${pageNum}"]`);
        if (target) target.scrollIntoView({ behavior: 'smooth', block: 'start' });
      }
    };

    window.toggleSidebar = function() {
      document.getElementById('pdfSidebar').classList.toggle('hidden');
    };

    window.switchSidebarTab = function(tab, btnElement) {
      document.querySelectorAll('.sidebar-tab').forEach(btn => btn.classList.remove('active'));
      document.querySelectorAll('.sidebar-panel').forEach(panel => panel.classList.remove('active'));
      btnElement.classList.add('active');
      document.getElementById('panel-' + tab).classList.add('active');
    };

    window.setTool = function(tool) {
      currentTool = tool;
      document.getElementById('selectTool').classList.toggle('active', tool === 'select');
      document.getElementById('highlightTool').classList.toggle('active', tool === 'highlight');
      document.getElementById('noteTool').classList.toggle('active', tool === 'note');

      document.querySelectorAll('.annotation-layer').forEach(layer => {
        layer.classList.toggle('active', tool !== 'select');
      });

      // Ajustar cursor
      pdfContainer.style.cursor = tool === 'highlight' ? 'crosshair' : (tool === 'note' ? 'text' : 'default');
    };

    window.zoomIn = function() {
      scale = Math.min(scale + 0.25, 3.0);
      updateZoom();
    };

    window.zoomOut = function() {
      scale = Math.max(scale - 0.25, 0.5);
      updateZoom();
    };

    function updateZoom() {
      zoomLevelEl.textContent = Math.round(scale * 100) + '%';
      pageObserver.disconnect();
      createPageContainers();
    }

    window.toggleSearch = function() {
      searchBarEl.classList.toggle('active');
      if (searchBarEl.classList.contains('active')) {
        searchInputEl.focus();
      }
    };

    window.handleSearch = function(event) {
      if (event.key === 'Enter') performSearch();
    };

    window.performSearch = async function() {
      const query = searchInputEl.value.trim();
      if (!query || !pdfDoc) return;

      searchResultsEl.innerHTML = '<p style="color:#9ca3af;">Buscando...</p>';

      const results = [];
      for (let i = 1; i <= pdfDoc.numPages; i++) {
        let text = '';
        if (pageTextContentCache[i]) {
          text = pageTextContentCache[i];
        } else {
          try {
            const page = await pdfDoc.getPage(i);
            const content = await page.getTextContent();
            text = content.items.map(item => item.str).join(' ');
            pageTextContentCache[i] = text;
          } catch(e) { continue; }
        }
        const regex = new RegExp(query, 'gi');
        let match;
        while ((match = regex.exec(text)) !== null) {
          const start = Math.max(0, match.index - 40);
          const end = Math.min(text.length, match.index + query.length + 40);
          results.push({ page: i, text: text.substring(start, end), index: match.index });
        }
      }

      if (results.length === 0) {
        searchResultsEl.innerHTML = '<p style="color:#9ca3af;">Sin resultados para "' + query + '".</p>';
        return;
      }

      let html = `<p style="font-weight:600; margin-bottom:8px;">${results.length} coincidencias</p>`;
      results.slice(0, 50).forEach((result, idx) => {
        const highlighted = result.text.replace(new RegExp(query, 'gi'), '<span class="highlight">$&</span>');
        html += `<div class="search-result-item" onclick="scrollToPage(${result.page})"><strong>Página ${result.page}</strong><br>${highlighted}...</div>`;
      });
      searchResultsEl.innerHTML = html;
    };

    // Gestión de anotaciones
    function loadAnnotationsForPage(pageNum) {
      const layer = document.getElementById('annotations-' + pageNum);
      if (!layer) return;
      layer.innerHTML = '';
      const pageAnnotations = annotations[pageNum] || [];

      pageAnnotations.forEach((annotation, index) => {
        if (annotation.type === 'note') {
          const div = document.createElement('div');
          div.className = 'annotation-note';
          div.style.left = annotation.x + 'px';
          div.style.top = annotation.y + 'px';
          div.innerHTML = `<button class="annotation-delete" onclick="deleteAnnotation(${pageNum}, ${index})">×</button>`;
          const textarea = document.createElement('textarea');
          textarea.value = annotation.text || '';
          textarea.placeholder = 'Comentario editorial...';
          textarea.onchange = function() {
            annotation.text = textarea.value;
            saveAnnotations();
            updateAnnotationCount();
            updateAnnotationsList();
          };
          div.appendChild(textarea);
          layer.appendChild(div);
        } else if (annotation.type === 'highlight') {
          const div = document.createElement('div');
          div.className = 'annotation-highlight';
          div.style.left = annotation.x + 'px';
          div.style.top = annotation.y + 'px';
          div.style.width = annotation.width + 'px';
          div.style.height = annotation.height + 'px';
          div.title = 'Subrayado';
          layer.appendChild(div);
        }
      });
    }

    // Clic para notas
    pdfContainer.addEventListener('click', function(e) {
      if (currentTool === 'note') {
        const wrapper = e.target.closest('.pdf-page-wrapper');
        if (wrapper && !e.target.closest('.annotation-note')) {
          const pageNum = parseInt(wrapper.dataset.page);
          const rect = wrapper.getBoundingClientRect();
          const x = e.clientX - rect.left;
          const y = e.clientY - rect.top;

          if (!annotations[pageNum]) annotations[pageNum] = [];
          annotations[pageNum].push({ type: 'note', x: x, y: y, text: '' });
          saveAnnotations();
          loadAnnotationsForPage(pageNum);
          updateAnnotationsList();
          updateAnnotationCount();
        }
      }
    });

    // Herramienta de subrayado: clic y arrastrar para crear resaltado
    let highlightStartX, highlightStartY, highlightStartPage, isHighlighting = false;
    let highlightOverlay = null;

    pdfContainer.addEventListener('mousedown', function(e) {
      if (currentTool !== 'highlight') return;
      const wrapper = e.target.closest('.pdf-page-wrapper');
      if (!wrapper) return;
      e.preventDefault();
      isHighlighting = true;
      highlightStartPage = parseInt(wrapper.dataset.page);
      const rect = wrapper.getBoundingClientRect();
      highlightStartX = e.clientX - rect.left;
      highlightStartY = e.clientY - rect.top;

      // Crear overlay de arrastre
      highlightOverlay = document.createElement('div');
      highlightOverlay.style.position = 'absolute';
      highlightOverlay.style.left = highlightStartX + 'px';
      highlightOverlay.style.top = highlightStartY + 'px';
      highlightOverlay.style.width = '0px';
      highlightOverlay.style.height = '0px';
      highlightOverlay.style.background = 'rgba(255, 108, 12, 0.3)';
      highlightOverlay.style.border = '1px dashed #FF6C0C';
      highlightOverlay.style.zIndex = '15';
      highlightOverlay.style.pointerEvents = 'none';
      wrapper.appendChild(highlightOverlay);
    });

    pdfContainer.addEventListener('mousemove', function(e) {
      if (!isHighlighting || !highlightOverlay) return;
      const wrapper = e.target.closest('.pdf-page-wrapper');
      if (!wrapper || parseInt(wrapper.dataset.page) !== highlightStartPage) return;
      const rect = wrapper.getBoundingClientRect();
      const currentX = e.clientX - rect.left;
      const currentY = e.clientY - rect.top;
      const width = currentX - highlightStartX;
      const height = currentY - highlightStartY;
      highlightOverlay.style.width = Math.abs(width) + 'px';
      highlightOverlay.style.height = Math.abs(height) + 'px';
      highlightOverlay.style.left = (width > 0 ? highlightStartX : currentX) + 'px';
      highlightOverlay.style.top = (height > 0 ? highlightStartY : currentY) + 'px';
    });

    pdfContainer.addEventListener('mouseup', function(e) {
      if (!isHighlighting) return;
      isHighlighting = false;
      if (!highlightOverlay) return;
      const wrapper = highlightOverlay.parentElement;
      if (!wrapper) return;
      const pageNum = parseInt(wrapper.dataset.page);
      const rect = wrapper.getBoundingClientRect();
      const left = parseFloat(highlightOverlay.style.left);
      const top = parseFloat(highlightOverlay.style.top);
      const width = parseFloat(highlightOverlay.style.width);
      const height = parseFloat(highlightOverlay.style.height);

      if (width > 5 && height > 5) {
        if (!annotations[pageNum]) annotations[pageNum] = [];
        annotations[pageNum].push({ type: 'highlight', x: left, y: top, width: width, height: height });
        saveAnnotations();
        loadAnnotationsForPage(pageNum);
        updateAnnotationCount();
        updateAnnotationsList();
      }
      highlightOverlay.remove();
      highlightOverlay = null;
    });

    window.deleteAnnotation = function(pageNum, index) {
      if (annotations[pageNum]) {
        annotations[pageNum].splice(index, 1);
        saveAnnotations();
        loadAnnotationsForPage(pageNum);
        updateAnnotationsList();
        updateAnnotationCount();
      }
    };

    function saveAnnotations() {
      localStorage.setItem('pdfAnnotations', JSON.stringify(annotations));
    }

    function updateAnnotationCount() {
      let count = 0;
      for (const pageAnns of Object.values(annotations)) {
        count += pageAnns.length;
      }
      annotationCountEl.textContent = count;
    }

    function updateAnnotationsList() {
      let html = '';
      let count = 0;
      for (const [pageNum, pageAnns] of Object.entries(annotations)) {
        pageAnns.forEach((ann) => {
          count++;
          html += `<div style="padding: 12px; background:#f9fafb; border:1px solid #e5e7eb; border-radius:6px; margin-bottom:8px; cursor:pointer;" onclick="scrollToPage(${pageNum})">`;
          html += `<strong style="font-size:12px; color:var(--elsevier-orange);">Página ${pageNum} · ${ann.type === 'highlight' ? 'Subrayado' : 'Nota'}</strong>`;
          html += `<p style="font-size:13px; margin:4px 0 0;">${ann.text || '<em>Sin texto</em>'}</p></div>`;
        });
      }
      if (count === 0) {
        annotationsListEl.innerHTML = '<p style="color: var(--text-muted); font-style: italic;">No hay notas registradas.</p>';
      } else {
        annotationsListEl.innerHTML = html;
      }
    }

    window.printPDF = function() {
      window.print();
    };

    window.downloadAnnotatedPDF = function() {
      const link = document.createElement('a');
      link.href = pdfUrl;
      link.download = title.replace(/[^a-z0-9]/gi, '_') + '.pdf';
      link.target = '_blank';
      document.body.appendChild(link);
      link.click();
      document.body.removeChild(link);

      if (Object.keys(annotations).length > 0) {
        const blob = new Blob([JSON.stringify(annotations, null, 2)], { type: 'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = title.replace(/[^a-z0-9]/gi, '_') + '_anotaciones.json';
        a.click();
        URL.revokeObjectURL(url);
      }
    };

    window.goBack = function() {
      if (document.referrer) {
        window.history.back();
      } else {
        window.close();
      }
    };

    // Atajos de teclado
    document.addEventListener('keydown', function(e) {
      if ((e.ctrlKey || e.metaKey) && e.key === 'f') {
        e.preventDefault();
        toggleSearch();
      }
      if (e.key === 'Escape') {
        searchBarEl.classList.remove('active');
      }
      if (e.key === 'h' || e.key === 'H') {
        setTool('highlight');
      }
      if (e.key === 'n' || e.key === 'N') {
        setTool('note');
      }
      if (e.key === 'v' || e.key === 'V') {
        setTool('select');
      }
    });

    // Inicialización de UI
    setTool('select');
    updateAnnotationCount();
    updateAnnotationsList();
  })();
</script>
</body>
</html>
